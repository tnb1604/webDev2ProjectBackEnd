version: "3"

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      # Ensure nginx.conf is world-readable and relabeled for SELinux: chmod 644 ./nginx.conf
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./app:/app:z
  php:
    build:
      context: .
      dockerfile: PHP.Dockerfile
    working_dir: /app
    volumes:
      - ./app:/app:z
  mysql:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: secret123
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: developmentdb
    volumes:
      - mysqldata:/var/lib/mysql
      # Ensure ./sql and its contents are readable and relabeled for SELinux: chmod -R 755 ./sql
      - ./sql:/docker-entrypoint-initdb.d:z
    ports:
      - 3306:3306

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: secret123
    ports:
      - 8080:80

volumes:
  mysqldata: {}
